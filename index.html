<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>耕火署名 · 页脚挂件预览</title>
    <link rel="stylesheet" href="./src/genghuo-powered-by-badge.css" />
    <link rel="icon" href="data:," />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #faf7f3;
        color: #202124;
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      main {
        width: min(100%, 1536px);
        margin-inline: auto;
        padding: clamp(20px, 3.5vw, 54px);
      }

      .symbol-library {
        position: absolute;
      }

      .preview-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-block: clamp(4px, 2vw, 30px) clamp(24px, 3vw, 46px);
        border-bottom: 1px solid #d9d4cf;
      }

      .preview-kicker {
        margin: 0 0 10px;
        color: #504e4c;
        font-size: clamp(10px, 2vw, 30px);
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 5.5vw, 84px);
        line-height: 1.12;
      }

      .preview-flame {
        flex: 0 0 auto;
        width: clamp(48px, 12vw, 180px);
        height: auto;
        margin-inline-end: 8px;
        color: #f26a1b;
      }

      .preview-grid {
        display: grid;
        grid-template-columns: minmax(0, 5fr) minmax(232px, 2fr);
        gap: clamp(24px, 2.7vw, 40px) clamp(24px, 3vw, 46px);
        margin-top: clamp(24px, 4vw, 60px);
      }

      .preview-example {
        min-width: 0;
      }

      .preview-example--mobile {
        grid-area: 1 / 2 / span 2 / 3;
        width: 100%;
        max-width: 390px;
      }

      .preview-example h2 {
        margin: 0 0 clamp(14px, 1.8vw, 27px);
        font-size: clamp(16px, 2vw, 28px);
        line-height: 1.4;
      }

      .sample-footer {
        display: grid;
        place-items: center;
        align-content: center;
        gap: 14px;
        min-height: clamp(128px, 12vw, 184px);
        padding: 24px 16px;
        border-top: 1px solid #d5d4d5;
        border-radius: 0 0 4px 4px;
        background: #f4f3f4;
        color: #555456;
        text-align: center;
      }

      .sample-footer--dark {
        border-top-color: #464646;
        background: #181818;
        color: #d0d0d0;
      }

      .sample-footer p {
        margin: 0;
        font-size: 13px;
      }

      @media (max-width: 720px) {
        .preview-heading {
          padding-bottom: 24px;
        }

        .preview-grid {
          grid-template-columns: minmax(0, 1fr);
          gap: 24px;
          margin-top: 24px;
        }

        .preview-example--mobile {
          grid-area: auto;
        }

        .sample-footer {
          min-height: 114px;
        }
      }
    </style>
  </head>
  <body>
    <svg class="symbol-library" width="0" height="0" aria-hidden="true">
      <symbol id="genghuo-flame" viewBox="0 0 180 216">
        <path
          fill="currentColor"
          d="M82.2 10.3C82.7 12.6 83 19.1 82.8 24.7L82.3 34.9 78.7 42.3
              C74.1 51.5 69.4 56.9 56.6 67.5 6.7 108.6-5.3 143.6 18.9 176.8
              L22.1 181.1 25.8 178.2C56.9 153.7 102.3 140.3 142.2 144
              C163 145.9 164.3 146.4 152 147.8 123.6 151.3 95.1 161.7 71.8 177.3
              C63 183.2 45 197.7 45 199 45 203.1 72.6 210.2 88.5 210.1
              C162.9 209.8 201.3 133.6 153.7 81 151.6 78.7 149.7 77 149.6 77.2
              C149.4 77.3 148.1 80.2 146.6 83.4 141.6 94.6 131.4 104 124.4 104
              C119.2 104 118.8 102.4 121.7 93.4 125.5 82.2 125.7 59 122.2 49
              C116.7 33.7 103.6 17.7 90 9.8 81.6 4.9 81 4.9 82.2 10.3Z"
        />
      </symbol>
    </svg>
    <main>
      <header class="preview-heading">
        <div>
          <p class="preview-kicker">GENGHUO / FOOTER BADGE</p>
          <h1>耕火署名</h1>
        </div>
        <svg class="preview-flame" width="180" height="216" viewBox="0 0 180 216" aria-hidden="true">
          <use href="#genghuo-flame" />
        </svg>
      </header>

      <div class="preview-grid">
        <section class="preview-example" aria-labelledby="light-title">
          <h2 id="light-title">浅色页脚</h2>
          <footer class="sample-footer">
            <p>© 示例网站 · 网站备案</p>
            <a class="genghuo-badge" href="https://www.genghuo.cn">
              <svg class="genghuo-badge__flame" width="14" height="14" aria-hidden="true"><use href="#genghuo-flame" /></svg>
              <span class="genghuo-badge__label">Powered by <strong class="genghuo-badge__brand">耕火科技</strong><span class="genghuo-badge__domain"> · genghuo.cn</span></span>
            </a>
          </footer>
        </section>

        <section class="preview-example" aria-labelledby="dark-title">
          <h2 id="dark-title">深色页脚</h2>
          <footer class="sample-footer sample-footer--dark">
            <p>© 示例网站 · 网站备案</p>
            <a class="genghuo-badge genghuo-badge--dark" href="https://www.genghuo.cn">
              <svg class="genghuo-badge__flame" width="14" height="14" aria-hidden="true"><use href="#genghuo-flame" /></svg>
              <span class="genghuo-badge__label">Powered by <strong class="genghuo-badge__brand">耕火科技</strong><span class="genghuo-badge__domain"> · genghuo.cn</span></span>
            </a>
          </footer>
        </section>

        <section class="preview-example preview-example--mobile" aria-labelledby="compact-title">
          <h2 id="compact-title">移动端 · 紧凑版</h2>
          <footer class="sample-footer">
            <p>© 示例网站 · 网站备案</p>
            <a class="genghuo-badge genghuo-badge--compact" href="https://www.genghuo.cn">
              <svg class="genghuo-badge__flame" width="14" height="14" aria-hidden="true"><use href="#genghuo-flame" /></svg>
              <span class="genghuo-badge__label">Powered by <strong class="genghuo-badge__brand">耕火科技</strong><span class="genghuo-badge__domain"> · genghuo.cn</span></span>
            </a>
          </footer>
        </section>
      </div>
    </main>
  </body>
</html>
